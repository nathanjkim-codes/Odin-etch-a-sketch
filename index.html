<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>ETCH-A-SKETCH</title>
  </head>
  <body>
    <div class="app">
      <h1>ETCH-A-SKETCH</h1>
      <div id="controls" class="controls">
        <span>New grid size:</span>
        <input
          type="number"
          id="user-input"
          min="1"
          max="100"
          class="user-input"
        />
        <button id="submitBtn" class="submitBtn">Submit</button>
      </div>

      <div id="color-container">
        <div class="pen-group">
          <label
            ><input
              type="radio"
              name="pen"
              id="black-pen"
              value="black-pen"
            />Black</label
          >
          <label
            ><input
              type="radio"
              name="pen"
              id="red-pen"
              value="red-pen"
            />Red</label
          >
          <label
            ><input
              type="radio"
              name="pen"
              id="blue-pen"
              value="blue-pen"
            />Blue</label
          >
          <label
            ><input
              type="radio"
              name="pen"
              id="rainbow-pen"
              value="rainbow-pen"
            />Rainbow</label
          >
          <label
            ><input
              type="radio"
              name="pen"
              id="eraser"
              value="eraser"
            />Eraser</label
          >
        </div>
        <button id="clearBtn" class="clearBtn">Clear</button>
      </div>

      <div id="grid-container"></div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
